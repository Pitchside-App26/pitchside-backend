# ---------------------------------------------------------------------------
# Football goals report: settings you can edit.
# Edit this file on GitHub (pencil icon), then "Commit changes". The next run
# uses the new values. Percentages are written as whole numbers (80 = 80%).
# ---------------------------------------------------------------------------

thresholds:
  over_1_5_highlight: 77        # Over 1.5 combined % at or above this is highlighted (and the "77%+ only" filter)
  gibh_highlight: 62            # Goal-in-both-halves combined % at or above this is highlighted
  min_games: 6                  # teams with fewer league games than this get a flag

# How hard each team's rate is pulled towards its league's average, in games.
# A team's estimate = (its hits + N x league rate) / (its games + N). Early-season
# records are short, and ranking 70 noisy figures puts the lucky ones on top, so
# raw rates overstate the picks (3-17 Oct: Over 1.5 legs said 87%, landed 79%;
# GIBH legs said 78%, landed 50%). Backtested on those weeks: 15 suits Over 1.5;
# GIBH calibrated better the harder it was pulled, hence 25. 0 = raw rates.
shrink_games:
  over_1_5: 15
  gibh: 25

markets:                        # which fixtures each tab (table, accumulator, track record) covers
  over_1_5:
    kickoffs: ["15:00"]         # UK kick-off times to include; [] = every kick-off time
    exclude_leagues: []         # league names to leave out
  gibh:
    kickoffs: ["15:00"]
    exclude_leagues: ["National League North", "National League South"]   # no GIBH market for these

accumulator:                    # the Over 1.5 accumulator
  min_legs: 16                  # suggested fold size, smallest
  max_legs: 18                  # suggested fold size, largest
  reserves: 6                   # reserves listed below the fold
  min_combined_pct: 77          # a fixture needs at least this Over 1.5 combined % to be considered
                                # (on the shrunk scale above, 77 lets 16-18 legs + 6 reserves fill most weeks)
  require_min_games: true       # leave out fixtures where either team has fewer than min_games
  # If fewer than `reserves` fixtures reach min_combined_pct, top the list up with the
  # best fixtures just under it, marked "below the line". false = never.
  fill_reserves_below_line: true
  # Shown on the accumulator card. Leave as "" to hide it.
  note: "SpreadEx acca boost: every leg must be priced above 1/10. Swap any leg priced 1/10 or shorter for the next reserve, top of the list first."

gibh_accumulator:               # the goal-in-both-halves accumulator
  # Smaller than the Over 1.5 fold on purpose: GIBH legs land far less often,
  # so each extra leg costs far more. A 6-fold at 60% a leg lands about 1 in 21.
  min_legs: 6
  max_legs: 6
  reserves: 2
  min_combined_pct: 62          # a fixture needs at least this GIBH combined % to be considered (shrunk scale)
  require_min_games: true
  fill_reserves_below_line: true
  note: ""

betting:                        # the bet-slip checklist and "Log bet" on each accumulator
  bookmakers: ["SpreadEx", "Sky Bet", "Bet365", "BetFred", "BoyleSports"]   # "Other" is always offered too
  default_bookmaker:            # pre-selected when logging; the last one you used for a market wins after that
    over_1_5: "SpreadEx"
    gibh: "Sky Bet"

odds:
  enabled: false                # set to true to add prices (needs the ODDS_API_KEY secret)
  min_price: 1.0                # only include a leg if its Over 1.5 price is better than this (1.0 = no filter)
  bookmaker_region: uk

data:
  max_results_age_days: 9       # warn if a league's newest result is older than this before the report date
  # If the CSV is behind a cross-checked source by more than this many matches, the league is marked stale.
  max_missing_results: 0
