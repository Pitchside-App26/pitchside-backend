name: Restore NFL results log from a run

# Every NFL ranking run also uploads results_log.sqlite3 as a build
# artifact. If that run's "Commit results log" step failed, this commits
# the artifact's copy instead, so the week's picks can still be graded.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "NFL Prop Rankings run ID to restore from. Leave blank for the latest one."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    concurrency:
      group: results-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Pick the run
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nfl-prop-rankings.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          fi
          case "$RUN_ID" in (*[!0-9]*|'') echo "::error::run_id must be a number"; exit 1;; esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: nfl-prop-results-log
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
          path: restored

      - name: Check the restored copy holds everything the repo copy does
        run: |
          python - <<'EOF'
          import sqlite3
          def counts(path):
              c = sqlite3.connect(path)
              tables = [r[0] for r in c.execute("select name from sqlite_master where type='table'")]
              return {t: c.execute(f"select count(*) from {t}").fetchone()[0] for t in tables}
          old, new = counts("nfl_prop_engine/results_log.sqlite3"), counts("restored/results_log.sqlite3")
          print("repo copy:", old)
          print("restored: ", new)
          short = [t for t, n in old.items() if new.get(t, 0) < n]
          if short:
              raise SystemExit(f"restored copy has fewer rows in {short}; not replacing the repo copy")
          EOF

      - name: Commit it
        run: |
          cp restored/results_log.sqlite3 nfl_prop_engine/results_log.sqlite3
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl_prop_engine/results_log.sqlite3
          git diff --cached --quiet && { echo "Already up to date."; exit 0; }
          git commit -m "chore: restore results log from run ${{ steps.pick.outputs.run_id }}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
