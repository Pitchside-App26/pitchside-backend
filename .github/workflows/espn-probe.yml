name: relay probe (temporary)
on:
  push:
    branches: [claude/nfl-prop-ranking-engine-kth7z5]
    paths: [.github/workflows/espn-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for the relay code, then check it
        run: |
          URL="https://pitchside-live.hello-pitchside.workers.dev/?date=20261114"
          for i in $(seq 1 20); do
            curl -sS -m 30 -H "Origin: https://pitchside-app26.github.io" -D head.txt "$URL" -o body.json || true
            if ! grep -q "Hello World" body.json; then break; fi
            echo "attempt $i: still Hello World"; sleep 30
          done
          cat head.txt; head -c 1500 body.json; echo
          python3 -c "import json,collections;d=json.load(open('body.json'));m=d.get('matches',[]);print(len(m),'matches',collections.Counter(x['league'] for x in m))"
      - name: Another origin gets no CORS header
        run: |
          curl -sS -m 30 -D - -o /dev/null -H "Origin: https://example.com" "https://pitchside-live.hello-pitchside.workers.dev/?date=20261114"
