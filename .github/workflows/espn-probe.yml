name: relay probe (temporary)
on:
  push:
    branches: [claude/nfl-prop-ranking-engine-kth7z5]
    paths: [.github/workflows/espn-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LiveScore stage names for English non-league and Scottish leagues
        run: |
          for d in 20261114 20261107 20261031 20261110 20261115; do
            curl -sS -m 30 "https://prod-public-api.livescore.com/v1/api/app/date/soccer/$d/0" -o f.json || true
            python3 -c "
          import json,sys
          f=json.load(open('f.json'))
          for s in f.get('Stages',[]):
              c,n=s.get('Cnm',''),s.get('Snm','')
              if (c=='England' and ('National' in n or 'Trophy' in n or 'FA Cup' in n)) or (c=='Scotland' and 'League' in n):
                  print('$d',repr(c),repr(n),len(s.get('Events',[])))
          "
          done
