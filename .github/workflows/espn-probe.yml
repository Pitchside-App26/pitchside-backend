name: ESPN probe (temporary)
on:
  push:
    branches: [claude/nfl-prop-ranking-engine-kth7z5]
    paths: [.github/workflows/espn-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ESPN soccer scoreboards and a summary
        run: |
          python3 - <<'PY'
          import json, urllib.request
          B = "https://site.api.espn.com/apis/site/v2/sports/soccer"
          def get(u):
              try: return json.load(urllib.request.urlopen(u, timeout=20))
              except Exception as e: print("FAIL", u, e); return None
          j = get(f"{B}/eng.3/scoreboard?dates=20261114")
          e = j["events"][0]; c = e["competitions"][0]
          print("status", json.dumps(e["status"])[:400]); print("event keys", list(e)); print("comp keys", list(c))
          for t in c["competitors"]:
              tm = t["team"]
              print(" ", t["homeAway"], tm.get("displayName"), "|", tm.get("shortDisplayName"), "|", tm.get("abbreviation"), "| score", t.get("score"), "| linescores", t.get("linescores"))
          s = get(f"{B}/eng.3/summary?event={e['id']}")
          print("summary keys", list(s))
          for t in s["header"]["competitions"][0]["competitors"]:
              print(" header", t["homeAway"], t["team"].get("displayName"), t.get("score"), t.get("linescores"))
          print(" header status", json.dumps(s["header"]["competitions"][0].get("status"))[:300])
          ke = s.get("keyEvents") or []
          print(" keyEvents", len(ke)); [print("  ", json.dumps({k: x.get(k) for k in ("type","text","clock","period","team","scoringPlay")})[:300]) for x in ke[:4]]
          a = get(f"{B}/all/scoreboard?dates=20261114")
          ea = a["events"][0]
          print("ALL event keys", list(ea)); print("ALL comp keys", list(ea["competitions"][0]))
          print("ALL league hints", json.dumps({k: ea.get(k) for k in ("league","season","uid")})[:300], json.dumps(ea["competitions"][0].get("league") or ea["competitions"][0].get("uid"))[:200])
          names = sorted({c["team"]["displayName"] for ev in a["events"] for c in ev["competitions"][0]["competitors"]})
          print("ALL teams sample", [n for n in names if any(k in n for k in ("Bolton","Stockport","Wrexham","Falkirk","Partick","Notts","Salford","Chesterfield"))])
          PY
