name: relay probe (temporary)
on:
  push:
    branches: [claude/nfl-prop-ranking-engine-kth7z5]
    paths: [.github/workflows/espn-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Relay with the tracker's origin
        run: |
          curl -sS -m 30 -D - -H "Origin: https://pitchside-app26.github.io" \
            "https://pitchside-live.hello-pitchside.workers.dev/?date=20261114" -o body.json
          echo; head -c 1200 body.json; echo
          python3 -c "import json;d=json.load(open('body.json'));m=d.get('matches',[]);print(len(m),'matches');from collections import Counter;print(Counter(x['league'] for x in m))"
      - name: Relay with another origin (should have no CORS header)
        run: |
          curl -sS -m 30 -D - -o /dev/null -H "Origin: https://example.com" "https://pitchside-live.hello-pitchside.workers.dev/?date=20261114"
