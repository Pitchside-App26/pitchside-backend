name: Live feed probe (temporary)
on:
  push:
    branches: [claude/nfl-prop-ranking-engine-kth7z5]
    paths: [.github/workflows/espn-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check browser access (CORS) and live fields
        run: |
          O="Origin: https://pitchside-app26.github.io"
          for u in "https://prod-public-api.livescore.com/v1/api/app/date/soccer/20261114/0" \
                   "https://prod-cdn-public-api.livescore.com/v1/api/app/date/soccer/20261114/0" \
                   "https://prod-public-api.livescore.com/v1/api/app/live/soccer/0"; do
            echo "== $u"; curl -sS -m 20 -D - -o /dev/null -H "$O" "$u" | grep -i -E "^HTTP|access-control|cache-control|content-type"
            echo "-- preflight"; curl -sS -m 20 -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: GET" "$u" | grep -i -E "^HTTP|access-control"
          done
          curl -sS -m 20 "https://prod-public-api.livescore.com/v1/api/app/date/soccer/20261114/0" -o d.json
          python3 - <<'PY'
          import json
          f = json.load(open("d.json"))
          want = {("England","National League: North"),("England","National League: South"),("Scotland","League 1"),("Scotland","League 2")}
          for st in f.get("Stages", []):
              if (st.get("Cnm"), st.get("Snm")) in want:
                  e = st["Events"][0]
                  print(st["Cnm"], st["Snm"], len(st["Events"]), "events; e.g.", e["T1"][0]["Nm"], "v", e["T2"][0]["Nm"],
                        {k: e.get(k) for k in ("Eid","Eps","Esd","Tr1","Tr2","Trh1","Trh2","Epr")})
          print("stage keys", list(f["Stages"][0])[:20]); print("event keys", list(f["Stages"][0]["Events"][0])[:40])
          PY
