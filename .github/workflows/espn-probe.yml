name: ESPN probe (temporary)
on:
  push:
    branches: [claude/nfl-prop-ranking-engine-kth7z5]
    paths: [.github/workflows/espn-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the scoreboard and one game summary
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports/football/nfl
          echo "== CORS headers"; curl -sS -D - -o /dev/null -H "Origin: https://pitchside-app26.github.io" "$B/scoreboard" | grep -i -E "access-control|content-type|cache-control"
          curl -sS "$B/scoreboard" -o sb.json
          python3 - <<'PY'
          import json, urllib.request
          sb = json.load(open("sb.json"))
          print("== top keys", list(sb))
          live = None
          for e in sb["events"]:
              c = e["competitions"][0]; st = e["status"]
              teams = {t["homeAway"]: (t["team"]["abbreviation"], t.get("score")) for t in c["competitors"]}
              print(e["id"], e.get("shortName"), teams, st["type"]["state"], st["type"].get("shortDetail"), st.get("period"), st.get("displayClock"))
              if st["type"]["state"] in ("in", "post") and live is None or (st["type"]["state"] == "in"):
                  live = e["id"] if live is None or st["type"]["state"] == "in" else live
          print("== status sample", json.dumps(sb["events"][0]["status"])[:600])
          s = json.load(urllib.request.urlopen(f"https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event={live}"))
          print("== summary", live, "keys", list(s))
          for team in s["boxscore"]["players"]:
              print("TEAM", team["team"].get("abbreviation"))
              for cat in team["statistics"]:
                  a = cat["athletes"][0] if cat.get("athletes") else {}
                  print("  ", cat.get("name"), "keys=", cat.get("keys"), "labels=", cat.get("labels"))
                  print("     e.g.", a.get("athlete", {}).get("displayName"), a.get("athlete", {}).get("shortName"), a.get("stats"))
          sp = s.get("scoringPlays") or []
          print("== scoringPlays", len(sp)); print(json.dumps(sp[0])[:900] if sp else "none")
          print("== header comp status", json.dumps(s["header"]["competitions"][0]["status"])[:400])
          PY
