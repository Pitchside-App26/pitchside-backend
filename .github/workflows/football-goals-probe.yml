name: Football Goals - data source probe

on:
  workflow_dispatch: {}
  push:
    branches: [ccr-c752a3e8-uikena]
    paths: [football_goals/tools/probe_sources.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python football_goals/tools/probe_sources.py
