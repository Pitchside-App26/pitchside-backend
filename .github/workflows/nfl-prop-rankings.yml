name: NFL Prop Rankings (weekly)

on:
  schedule:
    # Sunday 10:17 UTC, with a backup at 11:47. GitHub starts scheduled runs
    # late when it's busy, worst on the hour: the 11:00 slot ran 4.5 hours
    # late on 27 Sep and 4 Oct and hadn't started after 2 hours on 11 Oct.
    # Off-the-hour times are GitHub's own advice. Whichever slot actually
    # runs first does the work; the check job below makes the other skip.
    - cron: "17 10 * * 0"
    - cron: "47 11 * * 0"
  workflow_dispatch:
    inputs:
      teams:
        description: >-
          Optional: comma-separated team codes (e.g. NYG,DAL,KC,DEN) to limit
          this run to just the games involving them, instead of the full
          week's slate -- useful for a cheap test run. Leave blank to run
          everything (this is what the Sunday schedule always does).
        required: false
        default: ""

permissions:
  contents: write  # needed to commit results_log.sqlite3 back to the repo
  pages: write     # needed to publish the results page
  id-token: write  # required by actions/deploy-pages for its OIDC token
  actions: read    # the schedule check below lists this workflow's recent runs

jobs:
  # A scheduled run skips itself if another run of this workflow from the
  # last 12 hours -- manual or the other schedule slot -- got past this check
  # (its run job isn't skipped) and wasn't cancelled, so the slate is never
  # fetched twice (~150 Odds API credits each time). A red run still counts:
  # it can have fetched the odds and published the page. A manual run
  # limited to a few teams counts too.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/nfl-prop-rankings.yml/runs" \
                  -f created=">=$since" -f per_page=20 \
                  --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\") | .id")
          n=0
          for id in $ids; do
            # The run job's state; a run still in its check job has none yet and counts.
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                      --jq '[.jobs[] | select(.name == "run") | (.conclusion // .status)][0] // "pending"')
            if [ "$state" != "skipped" ]; then n=$((n + 1)); fi
          done
          if [ "$n" -gt 0 ]; then
            echo "Another run in the last 12 hours already covers this slate; skipping to save Odds API credits."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Shared with every workflow that commits results_log.sqlite3, so two
    # runs never write the file at once.
    concurrency:
      group: results-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: nfl_prop_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly prop ranking
        # A cap on a runaway run: the analyst sweep is the slow, paid part.
        timeout-minutes: 45
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # For the accumulator report's analyst sweep (Claude API + web
          # search), only on games where a leg survived every other gate.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Via env rather than ${{ }} inside the script, so text typed into
          # the "teams" box can't run as shell code.
          TEAMS: ${{ inputs.teams }}
        run: python run_weekly.py --teams "$TEAMS"

      - name: Upload results log as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-results-log
          path: nfl_prop_engine/results_log.sqlite3
          if-no-files-found: ignore

      - name: Assemble the published site
        # GitHub Pages hosts one site per repo. The football goals report
        # (football_goals/) lives under /goals/ on the same site, so every
        # deploy must carry both or one would wipe the other.
        working-directory: .
        run: |
          mkdir -p _site/goals
          cp -r nfl_prop_engine/site/. _site/
          if [ -d football_goals/site ]; then cp -r football_goals/site/. _site/goals/; fi

      - name: Upload results page for Pages
        # run_weekly.py just wrote nfl_prop_engine/site/data.json alongside
        # the static index.html -- upload the whole assembled site as this
        # run's Pages artifact; the deploy job below actually publishes it.
        # Runs before the commit so a failed push can't stop the page publishing.
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Commit results log
        # A fresh checkout every run means the SQLite file has no durability
        # of its own -- committing it back to the branch is what actually
        # satisfies "log every week's output somewhere durable" across runs.
        # Rebases first, since main may have moved during the run (only the
        # results-db group writes this file, so the rebase can't conflict).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_log.sqlite3
          git diff --cached --quiet && exit 0
          git commit -m "chore: log week's prop rankings"
          # --autostash: the run also rewrites the tracked site/data.json,
          # and git won't rebase over unsaved changes without it.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  deploy:
    needs: run
    # Publishes even if only the results-log commit failed: the page artifact
    # is uploaded before that step. The run job still shows red, so a lost
    # log commit doesn't go unnoticed.
    if: ${{ !cancelled() && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
