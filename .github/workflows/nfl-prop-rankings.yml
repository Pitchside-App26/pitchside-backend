name: NFL Prop Rankings (weekly)

on:
  schedule:
    # Sunday 11:00 UTC ~= 7:00am ET / 4:00am PT, before the early kickoff
    # window. Adjust for your timezone and preferred lead time.
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      teams:
        description: >-
          Optional: comma-separated team codes (e.g. NYG,DAL,KC,DEN) to limit
          this run to just the games involving them, instead of the full
          week's slate -- useful for a cheap test run. Leave blank to run
          everything (this is what the Sunday schedule always does).
        required: false
        default: ""

permissions:
  contents: write  # needed to commit results_log.sqlite3 back to the repo
  pages: write     # needed to publish the results page
  id-token: write  # required by actions/deploy-pages for its OIDC token

jobs:
  run:
    runs-on: ubuntu-latest
    # Shared with every workflow that commits results_log.sqlite3, so two
    # runs never write the file at once.
    concurrency:
      group: results-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: nfl_prop_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly prop ranking
        # A cap on a runaway run: the analyst sweep is the slow, paid part.
        timeout-minutes: 45
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # For the accumulator report's analyst sweep (Claude API + web
          # search), only on games where a leg survived every other gate.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Via env rather than ${{ }} inside the script, so text typed into
          # the "teams" box can't run as shell code.
          TEAMS: ${{ inputs.teams }}
        run: python run_weekly.py --teams "$TEAMS"

      - name: Upload results log as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-results-log
          path: nfl_prop_engine/results_log.sqlite3
          if-no-files-found: ignore

      - name: Upload results page for Pages
        # run_weekly.py just wrote nfl_prop_engine/site/data.json alongside
        # the static index.html -- upload the whole directory as this run's
        # Pages artifact; the deploy job below actually publishes it. Runs
        # before the commit so a failed push can't stop the page publishing.
        uses: actions/upload-pages-artifact@v3
        with:
          path: nfl_prop_engine/site

      - name: Commit results log
        # A fresh checkout every run means the SQLite file has no durability
        # of its own -- committing it back to the branch is what actually
        # satisfies "log every week's output somewhere durable" across runs.
        # Rebases first, since main may have moved during the run (only the
        # results-db group writes this file, so the rebase can't conflict).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_log.sqlite3
          git diff --cached --quiet && exit 0
          git commit -m "chore: log week's prop rankings"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  deploy:
    needs: run
    # Publishes even if only the results-log commit failed: the page artifact
    # is uploaded before that step. The run job still shows red, so a lost
    # log commit doesn't go unnoticed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
