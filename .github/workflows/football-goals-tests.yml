name: Football Goals Tests

on:
  push:
    paths: ["football_goals/**", ".github/workflows/football-goals-*.yml"]
  pull_request:
    paths: ["football_goals/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r football_goals/requirements.txt
      - run: python -m pytest -q football_goals/tests
