name: Grade Prop Results (weekly)

on:
  schedule:
    # Tuesday 12:00 UTC -- after Monday Night Football, so the whole
    # week's real slate has a final score by the time this runs.
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      regrade:
        description: "Grade every logged week again from scratch (after a grading fix)"
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit the graded results_log.sqlite3 back to the repo

jobs:
  grade:
    runs-on: ubuntu-latest
    # Shared with every workflow that commits results_log.sqlite3, so two
    # runs never write the file at once.
    concurrency:
      group: results-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: nfl_prop_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Grade logged props against real results
        # No ODDS_API_KEY needed -- this only pulls real final stats from
        # nflverse to grade against, never calls the odds API.
        env:
          REGRADE: ${{ inputs.regrade }}
        run: |
          if [ "$REGRADE" = "true" ]; then python grade_results.py --regrade; else python grade_results.py; fi

      - name: Commit graded results log
        # Same reasoning as the ranking workflow's commit step -- a fresh
        # checkout every run means the SQLite file has no durability of its
        # own, so the graded actual_value/graded_at columns only persist if
        # this commits them back.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_log.sqlite3
          git diff --cached --quiet && exit 0
          git commit -m "chore: grade last week's prop results"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Check the results log
        # After the commit on purpose: the grades are saved either way, and
        # a problem (a feed losing players, an empty analyst feed, props
        # never graded) turns this run red instead of skewing every report.
        run: python grade_results.py --check
