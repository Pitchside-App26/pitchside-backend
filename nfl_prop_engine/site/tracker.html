<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Bet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --rule: #c7cdd6;
    --rule-strong: #1b232e;
    --text: #1b232e;
    --sub: #5b6472;
    --won: #1c6e4a;
    --won-soft: #e3f1e9;
    --lost: #a6192e;
    --lost-soft: #f8e4e7;
    --live: #a9740f;
    --live-soft: #fbf1dc;
    --track: #dde2e9;
  }
  /* One person, one phone: a single committed light theme, as on index.html. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Source Sans 3", system-ui, sans-serif; font-size: 15px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.6rem; margin: 0; text-wrap: balance; }
  .meta { font-size: 0.78rem; color: var(--sub); }
  .back { font-size: 0.82rem; color: var(--sub); }
  .refresh {
    background: var(--text); color: var(--panel); border: 0; border-radius: 4px;
    padding: 8px 12px; font: inherit; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; cursor: pointer;
  }
  .refresh:focus-visible, .back:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .bet { background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 6px; margin-bottom: 18px; overflow: hidden; }
  .bet-head { display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-bottom: 1px solid var(--rule); }
  .bet-title { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 1.05rem; }
  .bet-sub { font-size: 0.78rem; color: var(--sub); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pill { align-self: flex-start; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
          padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  .pill.won { background: var(--won-soft); color: var(--won); }
  .pill.lost { background: var(--lost-soft); color: var(--lost); }
  .pill.live, .pill.pending { background: var(--live-soft); color: var(--live); }
  .tally { display: flex; gap: 3px; padding: 0 12px 10px; margin-top: -2px; }
  .tally span { flex: 1; height: 5px; background: var(--track); border-radius: 2px; }
  .tally span.won { background: var(--won); }
  .tally span.lost { background: var(--lost); }
  .tally span.winning { background: #8fc4a9; }
  .tally span.losing { background: #e8cf9c; }  /* not there yet, not lost */

  .legs { list-style: none; margin: 0; padding: 0; }
  .leg { padding: 10px 12px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 10px; }
  .mark { grid-row: 1 / span 3; font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
  .mark.won { color: var(--won); } .mark.lost { color: var(--lost); } .mark.winning, .mark.losing, .mark.pending, .mark.unknown, .mark.void { color: var(--sub); }
  .leg-name { font-weight: 600; }
  .leg-now { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .leg-game { grid-column: 2 / 4; font-size: 0.78rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .bar { grid-column: 2 / 4; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--live); }
  .bar i.won { background: var(--won); } .bar i.lost { background: var(--lost); }
  .leg-need { grid-column: 2 / 4; font-size: 0.78rem; color: var(--sub); }
  .empty, .error { text-align: center; color: var(--sub); padding: 40px 16px; line-height: 1.5; }
  footer { font-size: 0.75rem; color: var(--sub); line-height: 1.5; border-top: 1px solid var(--rule-strong); padding-top: 12px; margin-top: 24px; }
  @media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.6s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Fun slips</a>
  <header>
    <div>
      <h1>Live bet tracker</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </header>
  <main id="bets"><div class="empty">Loading your bets…</div></main>
  <footer>
    Live scores and stats from ESPN, refreshed every 30 seconds while a game is on. Settlement here is a guide:
    your bookmaker's rules decide (for example, a player who doesn't play is usually void).
  </footer>
</div>

<script src="tracker-core.js"></script>
<script>
(function () {
  "use strict";
  const T = window.TrackerCore;
  const ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
  const POLL_MS = 30000;
  let bets = [];
  let timer = null;

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function money(v) { return Number.isFinite(v) ? `£${v.toFixed(2)}` : ""; }
  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  function legTitle(leg) {
    if (leg.type === "moneyline") return `${leg.team} to win`;
    if (leg.type === "total") return `${leg.game.replace("@", " @ ")} ${leg.side} ${fmt(leg.line)} pts`;
    if (leg.type === "anytime_td") return `${leg.player} anytime TD`;
    const label = (T.STATS[leg.stat] || {}).label || leg.stat;
    return `${leg.player} ${leg.side} ${fmt(leg.line)} ${label}`;
  }

  function nowText(leg, r) {
    if (r.value === null || r.value === undefined) return "–";
    if (leg.type === "moneyline") return r.value > 0 ? `+${r.value}` : String(r.value);
    if (leg.type === "anytime_td") return `${r.value} TD`;
    return fmt(r.value);
  }

  function barWidth(leg, r) {
    if (r.status === "won") return 100;
    if (leg.type === "anytime_td") return r.value > 0 ? 100 : 0;
    if (leg.type === "moneyline" || !Number.isFinite(r.value) || !leg.line) return 0;
    return Math.max(0, Math.min(100, (r.value / leg.line) * 100));
  }

  function gameText(g) {
    if (!g) return "";
    return `${g.away.team} ${g.away.score} – ${g.home.score} ${g.home.team} · ${g.state === "pre" ? "starts " : ""}${g.detail}`;
  }

  const MARK = { won: "✓", lost: "✕", void: "–", winning: "•", losing: "•", pending: "○", unknown: "?" };
  const PILL = { won: "Won", lost: "Lost", live: "Live", pending: "Not started" };

  function betHtml(result) {
    const b = result.bet;
    const settledText = result.status === "won" ? `Returns ${money(b.returns)}`
      : result.status === "lost" ? "Lost" : `To return ${money(b.returns)}`;
    return `
      <article class="bet">
        <div class="bet-head">
          <div>
            <div class="bet-title">${esc(b.book)} ${esc(b.kind)}${b.odds ? ` · ${esc(b.odds)}` : ""}</div>
            <div class="bet-sub">Stake ${money(b.stake)} · ${settledText} · ${result.won} of ${result.total} landed</div>
          </div>
          <span class="pill ${result.status}">${PILL[result.status] || result.status}</span>
        </div>
        <div class="tally">${result.legs.map(l => `<span class="${l.status}"></span>`).join("")}</div>
        <ol class="legs">${result.legs.map(l => {
          const need = l.status === "won" || l.status === "lost" || l.status === "void" ? "" : T.progressText(l.leg, l);
          const note = l.note ? ` · ${esc(l.note)}` : "";
          return `
          <li class="leg">
            <span class="mark ${l.status}" aria-label="${l.status}">${MARK[l.status] || "?"}</span>
            <span class="leg-name">${esc(legTitle(l.leg))}</span>
            <span class="leg-now">${esc(nowText(l.leg, l))}</span>
            ${l.leg.type === "moneyline" ? "" : `<span class="bar"><i class="${l.status}" style="width:${barWidth(l.leg, l)}%"></i></span>`}
            <span class="leg-need">${esc(need)}${note}</span>
            <span class="leg-game">${esc(gameText(l.game))}</span>
          </li>`;
        }).join("")}</ol>
      </article>`;
  }

  async function update() {
    const meta = document.getElementById("meta");
    const el = document.getElementById("bets");
    try {
      const dates = [...new Set(bets.map(b => b.date).filter(Boolean))];
      const boards = await Promise.all((dates.length ? dates : [""]).map(d =>
        getJson(`${ESPN}/scoreboard${d ? `?dates=${d}` : ""}`)));
      const games = Object.assign({}, ...boards.map(T.parseScoreboard));

      // Box scores only for games a player leg needs, once they've started.
      const needed = new Set();
      for (const b of bets) for (const leg of b.legs) {
        const g = games[leg.game];
        if (g && g.state !== "pre" && (leg.type === "player" || leg.type === "anytime_td")) needed.add(g.id);
      }
      const boxscores = {};
      await Promise.all([...needed].map(async id => {
        try { boxscores[id] = T.parseBoxscore(await getJson(`${ESPN}/summary?event=${id}`)); }
        catch (e) { /* leg shows "box score not loaded yet" */ }
      }));

      const results = bets.map(b => T.evaluateBet(b, games, boxscores));
      const order = { live: 0, pending: 1, won: 2, lost: 3 };
      results.sort((a, b) => order[a.status] - order[b.status]);
      el.innerHTML = results.length ? results.map(betHtml).join("") : '<div class="empty">No bets to track yet.</div>';
      const anyLive = Object.values(games).some(g => g.state === "in");
      meta.textContent = `Updated ${new Date().toLocaleTimeString("en-GB")}${anyLive ? " · live" : ""}`;
      schedule(anyLive);
    } catch (e) {
      meta.textContent = `Couldn't reach the live feed (${e.message}). Retrying…`;
      schedule(true);
    }
  }

  function schedule(live) {
    clearTimeout(timer);
    if (document.hidden) return;  // picks up again when the tab is shown
    timer = setTimeout(update, live ? POLL_MS : POLL_MS * 4);
  }

  document.getElementById("refresh").addEventListener("click", update);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) update(); });

  getJson("bets.json?_=" + Date.now())
    .then(data => { bets = data.bets || []; update(); })
    .catch(e => {
      document.getElementById("bets").innerHTML = `<div class="error">Couldn't load your bets (${esc(e.message)}).</div>`;
    });
})();
</script>
</body>
</html>
